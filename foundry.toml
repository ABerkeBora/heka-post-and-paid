[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = []
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=contracts/vendor/oz/",
  "solady/=contracts/vendor/solady/",
]

[fuzz]
runs = 256

[fmt]
line_length = 120
